# 테스트는 외부 인프라 없이 돈다. MySQL 호환 모드의 H2 를 쓰고, 비밀 값은 더미로 채운다.
spring:
  datasource:
    url: jdbc:h2:mem:jamkkaebi;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - openid
              - profile
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: jamkkaebi-test-secret-key-please-change-me-32bytes
  access-token-validity-ms: 1800000
  refresh-token-validity-ms: 2592000000

app:
  auth:
    deep-link-uri: jamkkaebi://auth
    handoff-ttl: 60s
    login-session-ttl: 10m
